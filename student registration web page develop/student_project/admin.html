<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 style="text-align:center;">Admin - Student Data</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Gender</th>
        </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
</table>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];

let tableBody = document.getElementById("tableBody");

students.forEach(student => {
    let row = `
        <tr>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.age}</td>
            <td>${student.gender}</td>
        </tr>
    `;
    tableBody.innerHTML += row;
});
</script>

</body>
</html>
